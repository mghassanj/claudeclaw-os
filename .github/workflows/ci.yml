name: ci

# Typecheck, build and test the root app and the whatsapp/ service.
# Needs no secrets: the test guard (src/test-guard.ts) sandboxes every
# on-disk location and all network-touching suites are opt-in.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 = production host's Node major; 22 = .nvmrc (local dev).
        node: [20, 22]
    env:
      # whatsapp-web.js pulls in puppeteer; tests never launch a browser.
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            whatsapp/package-lock.json

      - name: Install (root)
        run: npm ci

      # --legacy-peer-deps: openai@4 declares an optional peer zod@^3 while
      # @anthropic-ai/claude-agent-sdk needs zod@^4. See CONTRIBUTING.md.
      - name: Install (whatsapp)
        working-directory: whatsapp
        run: npm ci --legacy-peer-deps

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (whatsapp)
        working-directory: whatsapp
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (root)
        run: npx vitest run

      - name: Test (whatsapp)
        working-directory: whatsapp
        run: npx vitest run
